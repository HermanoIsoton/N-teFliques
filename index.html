<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="Imagens/logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="" href="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NéteFliques</title>
</head>

<body>
    <aside class="menu">
        <picture><img src="Imagens/logo-header.png" alt="logo do site"></picture>
        <div><i class="bi bi-house-door"></i><button id="fonte-tudo">Inicio</button></div>
        <div><i class="bi bi-collection-play"></i><button id="fonte-filmes">Filmes</button></div>
        <div><i class="bi bi-collection-play"></i><button id="fonte-series">Séries</button></div>
        <div><i class="bi bi-tag"></i><button id="fonte-generos">Generos</button></div>
        <div><i class="bi bi-heart"></i><button>Favoritos</button></div>
        <div><i class="bi bi-star"></i><button>Assistir depois</button></div>
    </aside>

    <main class="main">
        <header>
            <div class="barraPesquisa"><i class="bi bi-search"></i>
                <input id="pesquisa" type="text" name="pesquisa" placeholder="Pesquise por titulo">
            </div>
            <div class="botao-cadastrar">
                <i class="bi bi-plus"></i> <a href="/NeteFliques/Front/cadastro.html">Cadastrar filme</a>
            </div>
        </header>
        <article id="carrosel">
            <i id="btn-esquerda" class="btn-left bi bi-arrow-left-short"></i>
            <div class="informacoes">
                <div class="titulo">
                </div>
                <div class="ano">
                </div>
                <div class="descricao">
                </div>
                <div class="btns">            
                </div>
                <div class="modal-container">
                    <div class="modal-conteudo">
                        <span id="btnFechar"></span>
                        <div class="video">
                            <iframe id="iframeVideo" src="" allow=" autoplay" allowfullscreen>
                            </iframe>
                        </div>
                    </div>
                </div>
            </div>
            <div class="carrosel"><i id="btn-direita" class="bi bi-arrow-right-short"></i></div>
        </article>
        <section>
            <div class="inicio">
                <h2>lançados recentemente</h3>
            </div>
            <div class="container-cards">
            </div>
        </section>
        <section>
            <div class="inicio">
                <h2>Filmes</h3>
            </div>
            <div class="container-cards-filmes">
            </div>
        </section>
        <section>
            <div class="inicio">
                <h2>Series</h3>
            </div>
            <div class="container-cards-series">
            </div>
        </section>
        <section>
            <div class="inicio">
                <h2>Filtrar Por Genero</h3>
                    <select name="genero" id="genero">
                        <option value="acao">Ação</option>
                        <option value="aventura">Aventura</option>
                        <option value="comedia">Comédia</option>
                        <option value="drama">Drama</option>
                        <option value="ficcao-cientifica">Ficção Científica</option>
                        <option value="fantasia">Fantasia</option>
                        <option value="terror">Terror</option>
                        <option value="suspense">Suspense</option>
                        <option value="romance">Romance</option>
                        <option value="animacao">Animação</option>
                        <option value="documentario">Documentário</option>
                        <option value="policial">Policial / Crime</option>
                        <option value="misterio">Mistério</option>
                    </select>
            </div>
            <div class="container-cards-genero">
            </div>
        </section>
        <section>
            <div class="inicio">
                <h2>Resultado...</h3>
            </div>
            <div class="container-cards-titulo">
            </div>
        </section>
       
    </main>
    <script src="index.js"></script>
</body>

</html>

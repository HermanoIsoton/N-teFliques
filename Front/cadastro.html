<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="cadastro.css" />
    <link rel="icon" type="image/x-icon" href="../logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
  </head>
  <body>
    <button>voltar</button>
    <div class="container">
      <form class="formulario" action="../Back/cadastro.php" method="post">
        <picture><img src="../logo-header.png" alt="logo do site" /></picture>
        <div>
          <p>Link da capa:</p>
          <input
            type="text "
            name="capa"
            placeholder="Link da foto do filme serie..."
          />
        </div>
        <div>
          <p>Titulo:</p>
          <input
            type="text"
            name="titulo"
            placeholder="Titulo do filme/serie..."
          />
        </div>
        <div>
          <p>data De Lançamento:</p>
          <input
            type="date"
            name="dataLancamento"
            placeholder="data De Lançamento do filme/serie..."
          />
        </div>
        <div>
          <p>Tipo:</p>
          <select name="tipo" id="tipo">
            <option value="filme">Filme</option>
            <option value="serie">Serie</option>
          </select>
        </div>
        <div>
          <p>Genero:</p>
          <select name="genero" id="genero">
            <option value="Acao">Ação</option>
            <option value="Aventura">Aventura</option>
          </select>
        </div>
        <div>
          <p>avaliação:</p>
          <input
            type="number"
            name="avaliacao"
            placeholder="Avaliação do filme/serie ex: 10.0..."
          />
        </div>
        <div>
          <p>sinopse</p>
          <input type="text" name="sinopse" placeholder="sinopse do filme" />
        </div>
        <button type="submit">Cadastrar</button>
      </form>
    </div>
    <div class="visualizacao">
      <h1>Pré-Visualização</h1>
      <div class="card">
        <div class="nome">TITULO FILME</div>
        <div class="categoria">SERIE</div>
        <div class="avaliacao"><p>10.0</p></div>
      </div>
    </div>
  </body>
</html>

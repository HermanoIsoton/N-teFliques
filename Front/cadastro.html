<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="cadastro.css">
    <link rel="icon" type="image/x-icon" href="../logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
     <button>voltar</button>
    <div class="container">
        
        <form class="formulario" action="" method="post">
              <picture><img src="../logo-header.png" alt="logo do site" ></picture>
            <div><p>Link da capa:</p><input type="text " name="capa" placeholder="Link da foto do filme serie..." ></div>
             <div><p>Titulo:</p><input type="text" name="titulo"  placeholder="Titulo do filme/serie..."></div>
              <div><p>Tipo:</p><input type="text" name="tipo" placeholder="FILME/SERIE..." ></div>
               <div><p>Genero:</p><input type="text" name="genero" placeholder="Genero do filme/serie..." ></div>
                <div><p>avaliação:</p><input type="number" name="avaliacao" placeholder="Avaliação do filme/serie ex: 10.0..."></div>
                 <button type="submit">Cadastrar</button>
        </form>
       
    </div>
    <div class="visualizacao">
        <h1>Pré-Visualização</h1>
        <div class="card">
        <div class="nome">TITULO FILME</div>
        <div class="categoria">SERIE</div>
        <div class="avaliacao"><p>10.0</p></div>
         </div>
    </div>
</body>
</html>

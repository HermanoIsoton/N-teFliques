<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="cadastro.css" />
    <link rel="icon" type="image/x-icon" href="../logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
  </head>
  <body>
    
      <form class="formulario" action="../Back/cadastro.php" method="post">
        <div class="topo"><button>Voltar</button>
          <picture><img src="..//Imagens/logo-header.png" alt="logo do site" /></picture>
        </div>
        <div class="campo">
          <label>Link da capa:</label>
          <input id="capa"
            type="text "
            name="capa"
            placeholder="Link da foto do filme serie..."
          />
        </div>
        <div class="campo">
          <label>Titulo:</label>
          <input id="titulo"
            type="text"
            name="titulo"
            placeholder="Titulo do filme/serie..."
          />
        </div>
        <div class="campo">
          <label>data De Lançamento:</label>
          <input id="data"
            type="date"
            name="dataLancamento"
            placeholder="data De Lançamento do filme/serie..."
          />
        </div>
        <div class="campo selects">
          <label>Tipo:</label>
          <select name="tipo"  id="tipo"  >
            <option value="filme">Filme</option>
            <option value="serie">Serie</option>
          </select>
          <label>Genero:</label>
          <select name="genero" id="genero" >
            <option value="acao">Ação</option>
            <option value="aventura">Aventura</option>
           <option value="comedia">Comédia</option>
           <option value="drama">Drama</option>
           <option value="ficcao-cientifica">Ficção Científica</option>
            <option value="fantasia">Fantasia</option>
            <option value="terror">Terror</option>
            <option value="suspense">Suspense</option>
            <option value="romance">Romance</option>
            <option value="animacao">Animação</option>
            <option value="documentario">Documentário</option>
            <option value="policial">Policial / Crime</option>
            <option value="misterio">Mistério</option>
          </select>
        </div >
        <div class="campo">
          <label>avaliação:</label>
          <input id="avaliacao"
            type="number"
            name="avaliacao"
            placeholder="Avaliação do filme/serie ex: 10.0..."
          />
        </div>
        <div class="campo">
          <label>sinopse</label>
          <input id="sinopse" type="text" name="sinopse" placeholder="sinopse do filme" />
        </div>
        <div class="btnCadastrar">
        <button id="cadastrar" type="submit">Cadastrar Filme</button>
        </div>
      </form>
    </div>
    <div class="visualizacao">
      <h1>Pré-Visualização</h1>
      <div class="card">
        <div class="nome">TITULO FILME</div>
        <div class="categoria">FILME</div>
        <div class="avaliacao">10.0</div>
      </div>
  <script src="preVisualizacao.js"></script>
  </body>
</html>
